components:
- components:
  - components:
    - layout_properties: {grid_position: 'FNEYCZ,SVTKJU'}
      name: email_label
      properties: {text: 'Email:'}
      type: Label
    - event_bindings: {pressed_enter: email_box_pressed_enter}
      layout_properties: {grid_position: 'FNEYCZ,JAEFUG'}
      name: email_box
      properties: {text: ''}
      type: TextBox
    - layout_properties: {grid_position: 'GDSDRP,AWSZZI'}
      name: password_label
      properties: {text: 'Password:'}
      type: Label
    - event_bindings: {hide: password_box_hide, pressed_enter: password_box_pressed_enter}
      layout_properties: {grid_position: 'GDSDRP,EWLPWX'}
      name: password_box
      properties: {hide_text: false, visible: true}
      type: TextBox
    - event_bindings: {click: login_btn_click}
      layout_properties: {grid_position: 'AKMWYE,UFXFQQ'}
      name: login_btn
      properties: {text: log in}
      type: Button
    - event_bindings: {click: signup_link_click}
      layout_properties: {grid_position: 'XMKOGN,BUFTIR'}
      name: signup_link
      properties: {align: center, text: sign up}
      type: Link
    layout_properties: {grid_position: 'DCAPWT,HASTRG'}
    name: outlined_card_1
    properties: {role: outlined-card}
    type: ColumnPanel
  layout_properties: {slot: default}
  name: content_panel
  properties: {}
  type: ColumnPanel
- layout_properties: {slot: title}
  name: title_label
  properties: {text: Maintenance App Login}
  type: Label
container:
  properties: {html: '@theme:standard-page.html'}
  type: HtmlTemplate
is_package: true
